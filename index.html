<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home&Kitchen</title>

    <!-- links -->
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- links-end -->
  </head>
  <body>
    <header>
      <nav class="body-font">
        <div class="logo">
          <a href="#">
            <img src="assets/logo.png" alt="Home&Kitchen Logo" />
          </a>
        </div>
        <div class="nav-links">
          <ul>
            <li>
              <a href="#home-page">Home</a>
            </li>
            <li>
              <a href="#shop-page">Shop</a>
            </li>
            <li>
              <a href="#collections-page">Collections</a>
            </li>
            <li>
              <a href="#about-page">About</a>
            </li>
            <li>
              <a href="#contact-page">Contact</a>
            </li>
          </ul>
        </div>
        <div class="nav-buttons">
          <i
            class="fa-solid fa-magnifying-glass"
          ></i>
          <i 
            class="fa-regular fa-heart"
          ></i>
          <i 
            class="fa-solid fa-bag-shopping"
          ></i>
          <a href="#shop-page" class="chocolate-links"> Shop Now </a>
        </div>
      </nav>
    </header>

    <main>
      <section id="home-page" class="home-page">
        <div class="home-page-left">
          <div class="trending-text body-font">
            <p>
              TRENDING COLLECTIONS
              <span class="chocolate-text"> + </span>
            </p>
          </div>

          <div class="home-page-heading heading-font">
            <p>
              Elevate Your Space
              <span class="chocolate-text"> Beautifully. </span>
            </p>
          </div>

          <div class="home-page-description body-font">
            <p>
              Discover stylish Pieces for your home & kitchen that blend
              comfort, function & elegance.
            </p>
          </div>

          <div class="cta">
            <a href="#" class="chocolate-links body-font">
              Explore Collection
            </a>
            <a href="#" class="watch-video-link">
              <i class="fa-solid fa-play" style="color: rgb(0, 0, 0)"></i>
              <span class="body-font">Watch Video</span>
            </a>
          </div>
        </div>

        <!-- checked -->
        <div class="home-page-right">
          <img src="assets/home-background-1.png" />

          <div class="accent-chair-price-card">
            <p class="card-product-name heading-font">Accent Chair</p>
            <p class="card-product-type body-font">Cozy Beige</p>
            <p class="card-product-price body-font">$189.00</p>
            <hr />

            <div class="color-options">
              <p class="body-font">Colors</p>
              <div id="first" class="colors"></div>
              <div id="second" class="colors"></div>
              <div id="third" class="colors"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
